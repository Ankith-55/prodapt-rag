# Scales pods on CPU. On the single-node demo cluster a second pod only fits if memory allows; real scale-out also
# needs the AKS cluster autoscaler to add nodes (az aks update --enable-cluster-autoscaler --min-count 1 --max-count 3).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ticketrag
  namespace: ticketrag
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ticketrag
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300   # avoid flapping when traffic is bursty
