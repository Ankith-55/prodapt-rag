# EXAMPLE ONLY. Do not commit real values. deploy/deploy_aks.ps1 creates the real secret from your local .env:
#   kubectl -n ticketrag create secret generic ticketrag-secrets \
#       --from-literal=OPENAI_API_KEY=... --from-literal=TICKETRAG_API_KEY=...
# In production prefer Azure Key Vault + the Secrets Store CSI driver over Kubernetes Secrets.
apiVersion: v1
kind: Secret
metadata:
  name: ticketrag-secrets
  namespace: ticketrag
type: Opaque
stringData:
  OPENAI_API_KEY: "sk-REPLACE"
  TICKETRAG_API_KEY: "REPLACE-with-a-long-random-string"
