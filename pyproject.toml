[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ticketrag"
version = "0.1.0"
description = "Semantic resolution assistant for support-desk tickets (RAG over NYC 311 history)"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ticketrag = ["static/*", "static/fonts/*"]

[tool.ruff]
line-length = 110
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
# Pinned so CI does not depend on whatever default rule set a given ruff version ships:
# pycodestyle errors, pyflakes (unused imports/variables, undefined names) and import sorting.
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
