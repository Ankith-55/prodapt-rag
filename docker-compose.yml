# Local run: docker compose up --build   (then open http://localhost:8000/)
# Needs a .env file with OPENAI_API_KEY; serves the committed ready-to-run state in ./artifacts/state
services:
  ticketrag:
    build: .
    image: ticketrag:local
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      TICKETRAG_STATE: /data/state
    volumes:
      - ./artifacts/state:/data/state
    restart: unless-stopped
